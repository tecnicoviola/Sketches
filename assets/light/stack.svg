<svg viewBox="0 0 1000 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tech Stack Grid Light">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&amp;family=Jost:wght@300;400;500&amp;display=swap');
    :root { --bone: #02122F; --rule: rgba(2, 18, 47, 0.18); --muted: rgba(2, 18, 47, 0.65); --frost: #23354D; }
    .serif { font-family: 'Cormorant Garamond', 'Times New Roman', Georgia, serif; }
    .sans { font-family: 'Jost', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <rect width="1000" height="320" rx="12" fill="none" stroke="var(--rule)" stroke-width="1"/>

  <text class="serif" fill="var(--bone)" x="48" y="48" font-size="24" font-weight="300" letter-spacing="4">05 — TECHNICAL STACK</text>
  <text class="sans" fill="var(--frost)" x="952" y="44" font-size="10" letter-spacing="2.5" font-weight="500" text-anchor="end">TECHNOLOGY GRID</text>

  <line x1="48" y1="64" x2="952" y2="64" stroke="var(--rule)" stroke-width="1"/>

  <!-- Row 1 -->
  <rect x="48" y="90" width="270" height="85" rx="6" fill="none" stroke="var(--rule)" stroke-width="1"/>
  <text class="serif" x="70" y="122" font-size="17" fill="var(--bone)" font-weight="500" letter-spacing="1">NEXT.JS 16 (TURBOPACK)</text>
  <text class="sans" x="70" y="148" font-size="11" fill="var(--muted)">App Router &amp; Server Components</text>

  <rect x="365" y="90" width="270" height="85" rx="6" fill="none" stroke="var(--rule)" stroke-width="1"/>
  <text class="serif" x="387" y="122" font-size="17" fill="var(--bone)" font-weight="500" letter-spacing="1">WEBSOCKETS (WS)</text>
  <text class="sans" x="387" y="148" font-size="11" fill="var(--muted)">Real-time room broadcasting</text>

  <rect x="682" y="90" width="270" height="85" rx="6" fill="none" stroke="var(--rule)" stroke-width="1"/>
  <text class="serif" x="704" y="122" font-size="17" fill="var(--bone)" font-weight="500" letter-spacing="1">PRISMA ORM &amp; POSTGRES</text>
  <text class="sans" x="704" y="148" font-size="11" fill="var(--muted)">Neon Serverless Database</text>

  <!-- Row 2 -->
  <rect x="48" y="195" width="270" height="85" rx="6" fill="none" stroke="var(--rule)" stroke-width="1"/>
  <text class="serif" x="70" y="227" font-size="17" fill="var(--bone)" font-weight="500" letter-spacing="1">GROQ AI ENGINE</text>
  <text class="sans" x="70" y="253" font-size="11" fill="var(--muted)">Text &amp; Mermaid diagram generation</text>

  <rect x="365" y="195" width="270" height="85" rx="6" fill="none" stroke="var(--rule)" stroke-width="1"/>
  <text class="serif" x="387" y="227" font-size="17" fill="var(--bone)" font-weight="500" letter-spacing="1">TURBOREPO &amp; PNPM 10</text>
  <text class="sans" x="387" y="253" font-size="11" fill="var(--muted)">Monorepo workspace pipeline</text>

  <rect x="682" y="195" width="270" height="85" rx="6" fill="none" stroke="var(--rule)" stroke-width="1"/>
  <text class="serif" x="704" y="227" font-size="17" fill="var(--bone)" font-weight="500" letter-spacing="1">VERCEL &amp; RENDER</text>
  <text class="sans" x="704" y="253" font-size="11" fill="var(--muted)">CI/CD &amp; cloud deployment</text>
</svg>
