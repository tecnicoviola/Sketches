<svg viewBox="0 0 1000 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Overview Section Light">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&amp;family=Jost:wght@300;400;500&amp;display=swap');
    :root { 
      --bone: #02122F; 
      --rule: rgba(2, 18, 47, 0.18); 
      --muted: rgba(2, 18, 47, 0.65); 
      --frost: #23354D; 
    }
    .serif { font-family: 'Cormorant Garamond', 'Times New Roman', Georgia, serif; }
    .sans { font-family: 'Jost', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <rect width="1000" height="200" rx="12" fill="none" stroke="var(--rule)" stroke-width="1"/>

  <text class="serif" fill="var(--bone)" x="48" y="52" font-size="26" font-weight="300" letter-spacing="4">01 — OVERVIEW &amp; PHILOSOPHY</text>
  <text class="sans" fill="var(--frost)" x="952" y="48" font-size="10" letter-spacing="2.5" font-weight="500" text-anchor="end">REAL-TIME COLLABORATIVE ENGINE</text>

  <line x1="48" y1="70" x2="952" y2="70" stroke="var(--rule)" stroke-width="1"/>

  <text class="sans" fill="var(--bone)" x="48" y="106" font-size="13.5" font-weight="400" letter-spacing="0.5">Sketches is a real-time collaborative drawing application and AI-assisted diagramming engine built for scale and restraint.</text>
  <text class="sans" fill="var(--muted)" x="48" y="132" font-size="12.5" font-weight="300" letter-spacing="0.3">Architected as a high-performance pnpm monorepo with Turborepo, it pairs a Next.js 16 frontend with an Express.js HTTP API</text>
  <text class="sans" fill="var(--muted)" x="48" y="154" font-size="12.5" font-weight="300" letter-spacing="0.3">and a standalone WebSocket server for live stroke-by-stroke canvas synchronization across active room members.</text>
</svg>
