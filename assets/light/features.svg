<svg viewBox="0 0 1000 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Features Section Light">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&amp;family=Jost:wght@300;400;500&amp;display=swap');
    :root { 
      --bone: #02122F; 
      --rule: rgba(2, 18, 47, 0.18); 
      --muted: rgba(2, 18, 47, 0.65); 
      --frost: #23354D; 
    }
    .serif { font-family: 'Cormorant Garamond', 'Times New Roman', Georgia, serif; }
    .sans { font-family: 'Jost', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <rect width="1000" height="280" rx="12" fill="none" stroke="var(--rule)" stroke-width="1"/>

  <text class="serif" fill="var(--bone)" x="48" y="48" font-size="24" font-weight="300" letter-spacing="4">04 — FEATURES &amp; CAPABILITIES</text>
  <text class="sans" fill="var(--frost)" x="952" y="44" font-size="10" letter-spacing="2.5" font-weight="500" text-anchor="end">PRODUCTION FEATURE SET</text>

  <line x1="48" y1="64" x2="952" y2="64" stroke="var(--rule)" stroke-width="1"/>

  <!-- Column 1 -->
  <text class="sans" fill="var(--bone)" x="48" y="104" font-size="12" font-weight="500" letter-spacing="1">⚡ REAL-TIME WEBSOCKET SYNC</text>
  <text class="sans" fill="var(--muted)" x="48" y="124" font-size="11" font-weight="300">Sub-millisecond multi-user stroke and cursor</text>
  <text class="sans" fill="var(--muted)" x="48" y="142" font-size="11" font-weight="300">broadcasting via 5-character room code slugs.</text>

  <text class="sans" fill="var(--bone)" x="48" y="184" font-size="12" font-weight="500" letter-spacing="1">✍️ 12 CANVAS DRAWING TOOLS</text>
  <text class="sans" fill="var(--muted)" x="48" y="204" font-size="11" font-weight="300">Selection, Pan, Rectangle, Diamond, Ellipse,</text>
  <text class="sans" fill="var(--muted)" x="48" y="222" font-size="11" font-weight="300">Arrow, Line, Pencil, Text, Image &amp; Eraser.</text>

  <!-- Column 2 -->
  <text class="sans" fill="var(--bone)" x="380" y="104" font-size="12" font-weight="500" letter-spacing="1">🪄 DECAYING ERASER TRAIL</text>
  <text class="sans" fill="var(--muted)" x="380" y="124" font-size="11" font-weight="300">Opacity-decay animation (350ms) rendered</text>
  <text class="sans" fill="var(--muted)" x="380" y="142" font-size="11" font-weight="300">behind active eraser movements.</text>

  <text class="sans" fill="var(--bone)" x="380" y="184" font-size="12" font-weight="500" letter-spacing="1">🤖 GROQ AI DIAGRAMMING</text>
  <text class="sans" fill="var(--muted)" x="380" y="204" font-size="11" font-weight="300">Convert natural language descriptions &amp; Mermaid</text>
  <text class="sans" fill="var(--muted)" x="380" y="222" font-size="11" font-weight="300">code directly into interactive canvas shapes.</text>

  <!-- Column 3 -->
  <text class="sans" fill="var(--bone)" x="700" y="104" font-size="12" font-weight="500" letter-spacing="1">🏠 HARD 3-ROOM ACTIVE CAP</text>
  <text class="sans" fill="var(--muted)" x="700" y="124" font-size="11" font-weight="300">Read-only generated code displays,</text>
  <text class="sans" fill="var(--muted)" x="700" y="142" font-size="11" font-weight="300">inline sharing &amp; room limits.</text>

  <text class="sans" fill="var(--bone)" x="700" y="184" font-size="12" font-weight="500" letter-spacing="1">🌌 SKETCHES+ PRO SHOWCASE</text>
  <text class="sans" fill="var(--muted)" x="700" y="204" font-size="11" font-weight="300">Full-bleed hero artwork, phrase rotation,</text>
  <text class="sans" fill="var(--muted)" x="700" y="222" font-size="11" font-weight="300">and production feature cards.</text>
</svg>
