<svg viewBox="0 0 1000 140" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Footer Status Light">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&amp;family=Jost:wght@300;400;500&amp;display=swap');
    :root { 
      --bg: #F0ECDD; 
      --moonlight: #02122F; 
      --rule: rgba(2, 18, 47, 0.15); 
      --muted: rgba(2, 18, 47, 0.65); 
      --frost: #23354D; 
    }
    .serif { font-family: 'Cormorant Garamond', 'Times New Roman', Georgia, serif; }
    .sans { font-family: 'Jost', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <rect width="1000" height="140" rx="12" fill="var(--bg)" stroke="var(--rule)" stroke-width="1"/>

  <text class="serif" fill="var(--moonlight)" x="48" y="58" font-size="32" font-weight="300" letter-spacing="4">SKETCHES</text>
  <text class="serif" fill="var(--muted)" x="330" y="56" font-size="16" font-weight="300" font-style="italic">— Real-time collaborative canvas &amp; AI engine.</text>
  <text class="sans" fill="var(--frost)" x="952" y="54" font-size="10" letter-spacing="2.5" font-weight="500" text-anchor="end">PRODUCTION DEPLOYED</text>

  <line x1="48" y1="84" x2="952" y2="84" stroke="var(--rule)" stroke-width="1"/>

  <text class="sans" fill="var(--muted)" x="48" y="112" font-size="11" letter-spacing="1">Designed &amp; Built by <tspan fill="var(--moonlight)" font-weight="500">Suhani Verma</tspan> (<tspan fill="var(--frost)">@tecnicoviola</tspan>)</text>
  <text class="sans" fill="var(--muted)" x="500" y="112" font-size="10" letter-spacing="2" font-weight="500" text-anchor="middle">MIT LICENSE</text>
  <text class="sans" fill="var(--frost)" x="952" y="112" font-size="11" letter-spacing="1.5" font-weight="500" text-anchor="end">sketches-canvas.vercel.app ↗</text>
</svg>
