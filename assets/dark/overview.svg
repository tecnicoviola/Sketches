<svg viewBox="0 0 1000 180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Overview Section">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&amp;family=Jost:wght@300;400;500&amp;display=swap');
    :root { 
      --bone: #F0ECDD; 
      --rule: rgba(240, 236, 221, 0.18); 
      --muted: rgba(240, 236, 221, 0.7); 
      --frost: #8BA3C5; 
    }
    .serif { font-family: 'Cormorant Garamond', 'Times New Roman', Georgia, serif; }
    .sans { font-family: 'Jost', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <rect width="1000" height="180" rx="12" fill="none" stroke="var(--rule)" stroke-width="1"/>

  <text class="serif" fill="var(--bone)" x="48" y="52" font-size="24" font-weight="300" letter-spacing="4">OVERVIEW &amp; PHILOSOPHY</text>
  <text class="sans" fill="var(--frost)" x="952" y="48" font-size="10" letter-spacing="2.5" font-weight="500" text-anchor="end">REAL-TIME COLLABORATIVE ENGINE</text>

  <line x1="48" y1="70" x2="952" y2="70" stroke="var(--rule)" stroke-width="1"/>

  <text class="sans" fill="var(--bone)" x="48" y="104" font-size="13" font-weight="400" letter-spacing="0.5">Sketches is a real-time collaborative drawing application and AI-assisted diagramming engine built for scale and restraint.</text>
  <text class="sans" fill="var(--muted)" x="48" y="128" font-size="12" font-weight="300" letter-spacing="0.3">Architected as a high-performance pnpm monorepo with Turborepo, it pairs a Next.js 16 frontend with an Express.js HTTP API</text>
  <text class="sans" fill="var(--muted)" x="48" y="148" font-size="12" font-weight="300" letter-spacing="0.3">and a standalone WebSocket server for live stroke-by-stroke canvas synchronization across active room members.</text>
</svg>
