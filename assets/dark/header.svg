<svg viewBox="0 0 1000 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sketches Header">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&amp;family=Jost:wght@300;400;500&amp;display=swap');
    
    :root { 
      --moonlight: #F0ECDD; 
      --rule: rgba(240, 236, 221, 0.18); 
      --muted: rgba(240, 236, 221, 0.6); 
      --frost: #8BA3C5; 
    }
    .serif { font-family: 'Cormorant Garamond', 'Times New Roman', Georgia, serif; }
    .sans { font-family: 'Jost', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 1.4s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .rise { opacity: 0; animation: rise .9s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0;transform:translateY(12px); } to { opacity:1;transform:translateY(0); } }
    .fade { opacity: 0; animation: fade .7s ease forwards; }
    @keyframes fade { to { opacity: 1; } }
    .a1{animation-delay:.1s} .a2{animation-delay:.3s} .a3{animation-delay:.6s} .a4{animation-delay:.9s}
    @media (prefers-reduced-motion: reduce) {
      .draw,.rise,.fade { animation: none; }
      .draw{stroke-dashoffset:0} .rise,.fade{opacity:1}
    }
  </style>

  <!-- Border Card (Transparent BG) -->
  <rect width="1000" height="240" rx="12" fill="none" stroke="var(--rule)" stroke-width="1"/>

  <!-- Title -->
  <g class="rise a1">
    <text fill="var(--moonlight)" class="serif" x="48" y="95" font-size="72" letter-spacing="8" font-weight="300">SKETCHES</text>
  </g>
  
  <!-- Subtitle -->
  <g class="fade a2">
    <text fill="var(--moonlight)" class="serif" x="48" y="138" font-size="24" font-weight="300" font-style="italic">Where collaboration <tspan font-style="normal" font-weight="400">truly</tspan> happens.</text>
  </g>

  <!-- Stack Line -->
  <g class="fade a3">
    <text fill="var(--muted)" class="sans" x="48" y="178" font-size="10" letter-spacing="3" font-weight="500">STACK  ▸</text>
    <text fill="var(--moonlight)" class="sans" x="128" y="178" font-size="11" letter-spacing="2.5" font-weight="400">NEXT.JS 16 · WEBSOCKETS · PRISMA · GROQ AI · TURBOREPO</text>
  </g>

  <!-- Divider & Footer Row -->
  <line class="draw a3" x1="48" y1="198" x2="952" y2="198" stroke="var(--rule)" stroke-width="1"/>
  <g class="fade a4">
    <text fill="var(--muted)" class="sans" x="48" y="220" font-size="10" letter-spacing="3" font-weight="500">12 CANVAS TOOLS</text>
    <text fill="var(--moonlight)" class="serif" x="195" y="220" font-size="14">·</text>
    <text fill="var(--muted)" class="sans" x="215" y="220" font-size="10" letter-spacing="3" font-weight="500">DECAYING ERASER TRAIL</text>
    <text fill="var(--moonlight)" class="serif" x="415" y="220" font-size="14">·</text>
    <text fill="var(--muted)" class="sans" x="435" y="220" font-size="10" letter-spacing="3" font-weight="500">3-ROOM ACTIVE CAP</text>
    <text fill="var(--frost)" class="sans" x="952" y="220" font-size="10" letter-spacing="3" font-weight="500" text-anchor="end">STATUS: PRODUCTION LIVE</text>
  </g>
</svg>
